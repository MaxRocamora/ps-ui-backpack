[project]
name = "pyside-ui-backpack"
version = "1.0.8"
description = "Helper functions for PySide2 UI Widgets"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maximiliano Rocamora", email = "maxirocamora@gmail.com" }]
requires-python = ">=3.11,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/MaxRocamora/ps-ui-backpack"

[dependency-groups]
dev = [
    "pyside6>=6.8.1.1; python_version < '3.15'",
    "pytest>=8.3.5",
    "pytest-qt>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
